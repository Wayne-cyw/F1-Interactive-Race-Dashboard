<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Dashboard - Standings</title>
    
    <!-- External Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../styles.css">

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-toggle" onclick="window.Utils.toggleSidebar()">

            </div>
            
            <div class="sidebar-header">

                    <i class="fas fa-flag-checkered"></i>
                    <span class="nav-text">F1 DASH</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="../index.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span class="nav-text">Race Analysis</span>
                </a>
                
                <a href="standings.html" class="nav-item active">
                    <i class="fas fa-trophy"></i>
                    <span class="nav-text">Standings</span>
                </a>
                
                <a href="teams.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span class="nav-text">Teams</span>
                </a>
                
                <a href="live.html" class="nav-item">
                    <i class="fas fa-signal"></i>
                    <span class="nav-text">Live Race</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <span class="nav-text">
                    F1 Dashboard v3.0<br />
                    Ultimate Edition
                </span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div id="root"></div>
        </div>
    </div>

    <!-- Utility Functions -->
    <script type="text/babel" src="../utils/helpers.js?v=3.0"></script>
    
    <!-- Standings Page Script -->
    <script type="text/babel" src="standings.js?v=3.0"></script>
