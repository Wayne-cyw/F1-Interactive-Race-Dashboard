<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Debug</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: Arial; 
            padding: 20px; 
        }
        .test { 
            background: #1a1a1a; 
            padding: 20px; 
            margin: 10px 0; 
            border-left: 4px solid #DC0000; 
        }
        .pass { border-left-color: #00ff00; }
        .fail { border-left-color: #ff0000; }
    </style>
</head>
<body>
    <h1 style="color: #DC0000;">Dashboard Debug</h1>
    
    <div id="tests"></div>
    
    <script type="text/babel" src="utils/helpers.js?v=3.0"></script>
    
    <script>
        const tests = [];
        
        // Test 1: React loaded?
        tests.push({
            name: 'React Loaded',
            pass: typeof React !== 'undefined',
            details: typeof React !== 'undefined' ? 'React version: ' + React.version : 'React not found'
        });
        
        // Test 2: ReactDOM loaded?
        tests.push({
            name: 'ReactDOM Loaded',
            pass: typeof ReactDOM !== 'undefined',
            details: typeof ReactDOM !== 'undefined' ? 'ReactDOM available' : 'ReactDOM not found'
        });
        
        // Wait a bit for helpers.js to load
        setTimeout(() => {
            // Test 3: Utils loaded?
            tests.push({
                name: 'Utils Loaded',
                pass: typeof window.Utils !== 'undefined',
                details: typeof window.Utils !== 'undefined' ? 'Utils object found with functions: ' + Object.keys(window.Utils).join(', ') : 'Utils not found'
            });
            
            // Test 4: API_URL correct?
            tests.push({
                name: 'API_URL Configured',
                pass: window.Utils?.API_URL === 'http://localhost:5000/api',
                details: 'API_URL: ' + (window.Utils?.API_URL || 'Not found')
            });
            
            // Test 5: formatLapTime function works?
            try {
                const formatted = window.Utils.formatLapTime(92.456);
                tests.push({
                    name: 'formatLapTime Function',
                    pass: formatted === '1:32.456',
                    details: `formatLapTime(92.456) = ${formatted} ${formatted === '1:32.456' ? '✓' : '✗ Expected: 1:32.456'}`
                });
            } catch (e) {
                tests.push({
                    name: 'formatLapTime Function',
                    pass: false,
                    details: 'Error: ' + e.message
                });
            }
            
            // Test 6: Can fetch seasons?
            fetch('http://localhost:5000/api/seasons')
                .then(res => res.json())
                .then(data => {
                    tests.push({
                        name: 'Fetch Seasons',
                        pass: data.status === 'success',
                        details: data.status === 'success' ? `Found ${data.seasons?.length} seasons` : 'Failed to fetch'
                    });
                    displayTests();
                })
                .catch(e => {
                    tests.push({
                        name: 'Fetch Seasons',
                        pass: false,
                        details: 'Error: ' + e.message
                    });
                    displayTests();
                });
        }, 1000);
        
        function displayTests() {
            const container = document.getElementById('tests');
            container.innerHTML = tests.map(test => `
                <div class="test ${test.pass ? 'pass' : 'fail'}">
                    <h3>${test.pass ? '✅' : '❌'} ${test.name}</h3>
                    <p>${test.details}</p>
                </div>
            `).join('');
            
            const allPassed = tests.every(t => t.pass);
            
            if (allPassed) {
                container.innerHTML += `
                    <div class="test pass" style="border: 3px solid #00ff00; margin-top: 30px;">
                        <h2 style="color: #00ff00;">🎉 All Tests Passed!</h2>
                        <p>Everything is working. The dashboard SHOULD load data.</p>
                        <p><strong>Next steps:</strong></p>
                        <ol>
                            <li>Visit <a href="index.html" style="color: #00ff00;">index.html</a></li>
                            <li>Hard refresh (Ctrl+Shift+F5 or Cmd+Shift+R)</li>
                            <li>Open Console (F12) and check for errors</li>
                            <li>Select a season and race</li>
                        </ol>
                    </div>
                `;
            } else {
                const failedTests = tests.filter(t => !t.pass);
                container.innerHTML += `
                    <div class="test fail" style="border: 3px solid #ff0000; margin-top: 30px;">
                        <h2 style="color: #ff0000;">❌ ${failedTests.length} Test(s) Failed</h2>
                        <p>Failed tests: ${failedTests.map(t => t.name).join(', ')}</p>
                    </div>
                `;
            }
        }
        
        // Display initial tests immediately
        setTimeout(displayTests, 100);
    </script>
</body>
</html>
