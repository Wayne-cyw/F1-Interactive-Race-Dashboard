<!-- @dsCard group="Data" height=330 subtitle="Panel with animated two-driver speed trace" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:32px;background:var(--surface-000);color:var(--ink);font-family:var(--font-sans)}
.panel{width:520px;max-width:100%;box-sizing:border-box;padding:var(--space-5);border-radius:var(--radius-lg);background:var(--surface-100);border:1px solid var(--line);box-shadow:var(--shadow-panel);display:flex;flex-direction:column;gap:14px}
.label{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
.live{display:flex;align-items:center;gap:8px;color:var(--brand-text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes draw{0%{stroke-dashoffset:1;opacity:1}70%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 8s cubic-bezier(.45,.05,.4,1) infinite}
.legend{display:flex;gap:24px;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.legend span{display:flex;align-items:center;gap:8px}
.key{width:18px;height:3px;display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.trace{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="panel">
<div class="label"><span>Speed trace · Lap comparison</span><span class="live"><span class="dot"></span>Live</span></div>
<svg width="100%" viewBox="0 0 470 140" fill="none" role="img" aria-label="Two speed traces compared across a lap">
<line x1="0" y1="35" x2="470" y2="35" stroke="var(--line)"/><line x1="0" y1="70" x2="470" y2="70" stroke="var(--line)"/><line x1="0" y1="105" x2="470" y2="105" stroke="var(--line)"/>
<path class="trace" pathLength="1" d="M0 112 C34 112 42 28 75 28 S117 120 150 120 S192 22 233 22 S275 100 308 100 S358 32 392 32 S450 90 470 66" stroke="var(--data-b)" stroke-width="2.5" stroke-linecap="round"/>
<path class="trace" pathLength="1" style="animation-delay:.12s" d="M0 116 C34 116 46 34 80 34 S122 112 155 112 S197 28 238 28 S280 94 313 94 S363 38 397 38 S452 86 470 70" stroke="var(--data-a)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
<div class="legend"><span><i class="key" style="background:var(--data-a)"></i>Driver A</span><span><i class="key" style="background:var(--data-b)"></i>Driver B</span></div>
</div>
</body>
</html>
