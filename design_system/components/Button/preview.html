<!-- @dsCard group="Actions" height=150 subtitle="Primary, secondary and text link" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:32px;background:var(--surface-000);color:var(--ink);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:var(--space-6);flex-wrap:wrap}
a{text-decoration:none;color:inherit}
.btn{display:inline-flex;align-items:center;gap:14px;min-height:44px;box-sizing:border-box;padding:16px 28px;border-radius:var(--radius-pill);font-size:17px;line-height:22px;font-weight:600;transition:transform .25s cubic-bezier(.2,.7,.2,1),background .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px)}
.btn:hover .arrow{transform:translateX(6px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.arrow{transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.primary{background:var(--brand);color:var(--on-brand)}
.primary:hover{background:var(--brand-hover);box-shadow:var(--shadow-glow)}
.secondary{background:var(--surface-100);color:var(--ink);border:1px solid var(--line)}
.secondary:hover{border-color:var(--brand)}
.link{font-size:16px;font-weight:500;color:var(--ink-muted);border-bottom:1px solid var(--ink-muted);padding-bottom:3px}
.link:hover{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="row">
<a class="btn primary" href="#">Enter the pit wall
<svg class="arrow" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 10h13M11 4l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg></a>
<a class="btn secondary" href="#">Compare drivers</a>
<a class="link" href="#">See what&#39;s inside</a>
</div>
</body>
</html>
