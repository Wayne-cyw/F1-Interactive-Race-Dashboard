<!-- @dsCard group="Data" height=210 subtitle="Tyre stint rows with compound legend" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:32px;background:var(--surface-000);color:var(--ink);font-family:var(--font-sans)}
.well{width:460px;max-width:100%;box-sizing:border-box;padding:18px;border-radius:var(--radius-md);background:var(--surface-100);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.pos{width:28px;font-family:var(--font-mono);font-size:12px;color:var(--ink-muted)}
.stints{display:flex;gap:3px;flex-grow:1;height:16px}
.stints div{border-radius:var(--radius-xs);transform-origin:left center;animation:stint 6s ease-in-out infinite}
@keyframes stint{0%{transform:scaleX(0)}35%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.s{background:var(--compound-soft)}.m{background:var(--compound-medium)}.h{background:var(--compound-hard)}
.legend{display:flex;gap:20px;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:8px;border-radius:2px;display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="well">
<div class="row"><span class="pos">P1</span><div class="stints"><div class="s" style="width:34%"></div><div class="m" style="width:40%;animation-delay:.25s"></div><div class="h" style="width:26%;animation-delay:.5s"></div></div></div>
<div class="row"><span class="pos">P2</span><div class="stints"><div class="m" style="width:22%;animation-delay:.15s"></div><div class="h" style="width:44%;animation-delay:.4s"></div><div class="m" style="width:34%;animation-delay:.65s"></div></div></div>
<div class="row"><span class="pos">P3</span><div class="stints"><div class="s" style="width:46%;animation-delay:.3s"></div><div class="h" style="width:54%;animation-delay:.55s"></div></div></div>
<div class="legend"><span><i class="s"></i>Soft</span><span><i class="m"></i>Medium</span><span><i class="h"></i>Hard</span></div>
</div>
</body>
</html>
